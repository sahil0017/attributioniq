<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="240" viewBox="0 0 1100 240" role="img" aria-label="AttributionIQ: which channels actually drive revenue">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8ab4f8"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="240" rx="18" fill="url(#bg)"/>

  <g opacity="0.12" stroke="#ffffff">
    <path d="M0 60H1100M0 120H1100M0 180H1100"/>
  </g>

  <text x="48" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="url(#title)">AttributionIQ</text>
  <text x="50" y="146" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Which marketing channels actually drive revenue?</text>
  <text x="50" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Events + orders + ad spend  →  customer journeys  →  channel revenue &amp; ROAS</text>

  <g transform="translate(700 0)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    <line x1="0" y1="200" x2="360" y2="200" stroke="#475569"/>

    <rect x="20" y="200" width="46" height="0" rx="6" fill="#1a73e8">
      <animate attributeName="height" values="0;110;110;0" keyTimes="0;0.35;0.9;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="200;90;90;200" keyTimes="0;0.35;0.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="200" width="46" height="0" rx="6" fill="#ea8600">
      <animate attributeName="height" values="0;70;70;0" keyTimes="0;0.45;0.9;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="200;130;130;200" keyTimes="0;0.45;0.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="172" y="200" width="46" height="0" rx="6" fill="#34a853">
      <animate attributeName="height" values="0;140;140;0" keyTimes="0;0.55;0.9;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="200;60;60;200" keyTimes="0;0.55;0.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="248" y="200" width="46" height="0" rx="6" fill="#a142f4">
      <animate attributeName="height" values="0;45;45;0" keyTimes="0;0.65;0.9;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="200;155;155;200" keyTimes="0;0.65;0.9;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="43" y="222">Google</text>
    <text x="119" y="222">Meta</text>
    <text x="195" y="222">Organic</text>
    <text x="271" y="222">TikTok</text>

    <polyline fill="none" stroke="#fbbc04" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
              points="43,80 119,120 195,50 271,145" stroke-dasharray="400" stroke-dashoffset="400">
      <animate attributeName="stroke-dashoffset" values="400;0;0;400" keyTimes="0;0.6;0.9;1" dur="5s" repeatCount="indefinite"/>
    </polyline>
    <text x="330" y="60" fill="#fbbc04" font-size="14" text-anchor="end">ROAS</text>
  </g>
</svg>
