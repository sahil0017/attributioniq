name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: attributioniq
          POSTGRES_USER: attribution
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attribution -d attributioniq"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: attributioniq
      PGUSER: attribution
      PGPASSWORD: local_dev_password
      PGURL: jdbc:postgresql://localhost:5432/attributioniq
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test (runs Flyway migrations + API tests)
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (Streamlit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests -q
      - name: Dashboard smoke test (no backend needed)
        run: |
          python - <<'EOF'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("streamlit_app.py", default_timeout=60).run()
          assert not at.exception, at.exception
          EOF

  scripts:
    name: Sender scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and dry-run
        run: |
          python -m py_compile backend/scripts/*.py
          python backend/scripts/ingest_dataset.py backend/requirement/urbanthread_data_sep2026.zip \
            --api-url http://localhost:8080 --dry-run

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
