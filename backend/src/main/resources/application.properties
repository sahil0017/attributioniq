spring.application.name=attribution-iq

# Server
server.port=${PORT:8080}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:attributioniq}
spring.datasource.username=${PGUSER:attribution}
spring.datasource.password=${PGPASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Standalone Flyway Maven plugin
flyway.url=${PGURL:jdbc:postgresql://localhost:5432/attributioniq}
flyway.user=${PGUSER:attribution}
flyway.password=${PGPASSWORD:local_dev_password}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true

# Durable attribution/session recompute worker
attribution.recompute.fixed-delay-ms=${ATTRIBUTION_RECOMPUTE_DELAY_MS:100}
attribution.recompute.max-jobs-per-cycle=${ATTRIBUTION_RECOMPUTE_MAX_JOBS_PER_CYCLE:50}

# Actuator health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Include the request correlation ID set by RequestTracingFilter in every log line.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%X{requestId:-}] %-5level %logger{36} - %msg%n
